{% set name = "qdrant-client" %}
{% set version = "1.15.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/qdrant/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 01e8870253493024d527bae5466c0864bf10cb5e1621f5fe23d5154582cd3f2b

build:
  skip: True # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - pip
    - poetry-core
    - setuptools
  run:
    - python
    - httpx >=0.20.0
    - numpy >=1.21
    - pydantic >=1.10.8
    - grpcio >=1.41.0
    - grpcio-tools >=1.41.0
    - urllib3 >=1.26.14,<3
    - portalocker >=2.7.0,<4.0
  run_constrained:
    - fastembed >=0.2.5

{% set ignore_integration_test = [
  "--ignore=tests/congruence_tests",
  "--ignore=tests/test_qdrant_client.py",
  "--ignore=tests/test_migrate.py",
  "--ignore=tests/test_async_qdrant_client.py"
]%}
test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - qdrant_client
  commands:
    - pip check
    - pytest -v {{ ignore_integration_test | join(" ")}}
  requires:
    - pip
    - python
    - pytest
    - pytest-docker-tools

about:
  home: https://github.com/qdrant/qdrant-client
  summary: Python client for Qdrant vector search engine
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - moritzwilksch
